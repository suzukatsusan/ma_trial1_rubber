    // =========================================================================
    // モジュール2：固変分解クイズ
    // =========================================================================
    function QuizView({ onBack }) {
      const [idx, setIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [showFb, setShowFb] = useState(false);
      const [score, setScore] = useState(0);
      const [done, setDone] = useState(false);

      const q = QUIZ_DATA[idx];

      const handleAns = (ans) => {
        if (selected) return;
        const isCor = ans === q.a;
        setSelected(ans);
        setShowFb(true);
        if (isCor) setScore(s => s + 1);
      };

      const handleNext = () => {
        if (idx < QUIZ_DATA.length - 1) {
          setIdx(i => i + 1);
          setSelected(null);
          setShowFb(false);
        } else {
          setDone(true);
        }
      };

      return (
        <div>
          <SubHeader title="固変分解クイズ（実務版）" sub="パート1：勘定科目法" icon={HelpCircle} onBack={onBack} />
          <main className="max-w-2xl mx-auto px-4 py-6">
            {!done ? (
              <div className="bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-6">
                <div className="flex justify-between items-center text-xs font-bold text-slate-400 border-b pb-3">
                  <span>第 {idx + 1} 問 / 10問中</span>
                  <span>正解数: {score} 点</span>
                </div>

                <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-center min-h-[100px] flex items-center justify-center">
                  <h3 className="text-xl md:text-2xl font-black text-slate-900">{q.q}</h3>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  {['変動費', '固定費'].map(opt => {
                    const isCor = opt === q.a;
                    let style = 'bg-white border-slate-200 hover:border-slate-300';
                    if (showFb) {
                      if (isCor) style = 'border-emerald-500 bg-emerald-50 text-emerald-800 ring-2 ring-emerald-300';
                      else if (selected === opt) style = 'border-rose-500 bg-rose-50 text-rose-800';
                      else style = 'opacity-40 bg-slate-50';
                    }
                    return (
                      <button
                        key={opt}
                        disabled={showFb}
                        onClick={() => handleAns(opt)}
                        className={`py-6 rounded-2xl border-4 font-black text-2xl transition-all ${style}`}
                      >
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {showFb && (
                  <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-xs md:text-sm space-y-3 animate-in fade-in">
                    {q.practical && (
                      <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 text-amber-900 font-medium">
                        💡 <strong>現場と理屈のギャップ：</strong> {q.theory}
                      </div>
                    )}
                    <p className="text-slate-700 leading-relaxed">
                      <strong>🔍 なぜ「{q.a}」として扱うのか？：</strong><br />
                      {q.exp}
                    </p>
                    <button onClick={handleNext} className="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-xs hover:bg-slate-800">
                      {idx < QUIZ_DATA.length - 1 ? '次の問題へ進む →' : '結果を見る'}
                    </button>
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-white rounded-3xl p-8 border border-slate-200 text-center space-y-6">
                <Trophy className="w-16 h-16 text-amber-500 mx-auto" />
                <h3 className="text-2xl font-black text-slate-900">クイズ完了！</h3>
                <div className="text-4xl font-black text-blue-600">{score} / 10 問正解</div>
                <button onClick={() => { setIdx(0); setSelected(null); setShowFb(false); setScore(0); setDone(false); }} className="px-8 py-3 bg-slate-900 text-white font-bold rounded-xl text-xs">
                  もう一度挑戦する
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

                </div>

                <div>
                  <h3 className="text-base font-bold text-slate-900 mb-2">{q.title}</h3>
                  <p className="text-xs md:text-sm text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-200 leading-relaxed font-medium">
                    {q.desc}
                  </p>
                </div>

                <div className="space-y-3">
                  {q.opts.map((opt, i) => (
                    <button
                      key={i}
                      disabled={showFb}
                      onClick={() => handleSelect(i)}
                      className={`w-full text-left p-4 rounded-xl border-2 text-xs md:text-sm font-bold transition-all ${
                        sel === i ? 'border-blue-600 bg-blue-50 text-blue-900' : 'border-slate-200 hover:border-slate-300 bg-white'
                      }`}
                    >
                      {opt.text}
                    </button>
                  ))}
                </div>

                {showFb && (
                  <div className={`p-5 rounded-2xl border-2 space-y-3 text-xs md:text-sm animate-in fade-in ${
                    q.opts[sel].best ? 'bg-emerald-50 border-emerald-300 text-emerald-950' : 'bg-rose-50 border-rose-300 text-rose-950'
                  }`}>
                    <h4 className="font-black text-sm">{q.opts[sel].best ? '◎ 大正解！プロの購買判断' : '⚠️ 危険！現場や財務が崩壊します'}</h4>
                    <p className="leading-relaxed">{q.opts[sel].fb}</p>
                    <button onClick={handleNext} className="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-xs hover:bg-slate-800">
                      {idx < PURCHASING_DATA.length - 1 ? '次の問題へ進む →' : '最終決算を見る'}
                    </button>
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-white rounded-3xl p-8 border border-slate-200 text-center space-y-6">
                <Trophy className="w-16 h-16 text-emerald-500 mx-auto" />
                <h3 className="text-2xl font-black text-slate-900">購買改革 最終レポート</h3>
                <div className="flex justify-center gap-6 text-sm">
                  <div>獲得利益: <strong className="text-2xl block text-emerald-600">+{profit}万</strong></div>
                  <div>期末現金: <strong className="text-2xl block text-blue-600">{cash}万</strong></div>
                </div>
                <button onClick={() => { setIdx(0); setSel(null); setShowFb(false); setCash(500); setProfit(0); setDone(false); }} className="px-8 py-3 bg-slate-900 text-white font-bold rounded-xl text-xs">
                  もう一度挑戦する
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    // =========================================================================
    // モジュール4：プロダクトミックス体験
    // =========================================================================
    function ProductMixView({ onBack }) {
      const [rA, setRA] = useState(70);
      const [rB, setRB] = useState(25);
      const [rC, setRC] = useState(5);

      const sA = Math.round(1000 * (rA / 100));
      const sB = Math.round(1000 * (rB / 100));
      const sC = 1000 - sA - sB;

      const mA = Math.round(sA * 0.15);
      const mB = Math.round(sB * 0.50);
      const mC = Math.round(sC * 0.75);
      const totalM = mA + mB + mC;
      const op = totalM - 300;

      const handleSlider = (v) => {
        setRA(v);
        const rem = 100 - v;
        setRB(Math.round(rem * 0.6));
        setRC(rem - Math.round(rem * 0.6));
      };

      return (
        <div>
          <SubHeader title="プロダクトミックス体験" sub="同じ売上1000万円で利益激変スライダー" icon={PieChart} onBack={onBack} />
          <main className="max-w-4xl mx-auto px-4 py-6 space-y-6">
            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
              <div className="flex justify-between items-center pb-3 border-b">
                <div>
                  <h3 className="font-bold text-slate-900 text-sm">月商1,000万円固定の製品構成比スライダー</h3>
                  <p className="text-xs text-slate-400">構成比を変えるだけで営業利益が赤字から＋300万円超へ跳ね上がります。</p>
                </div>
                <div className="text-right">
                  <span className="text-xs text-slate-400 block">営業利益</span>
                  <span className={`text-2xl font-black ${op >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    {op >= 0 ? `+${op}` : op} 万円
                  </span>
                </div>
              </div>

              <div>
                <div className="flex justify-between text-xs font-bold mb-1">
                  <span className="text-rose-600">製品A（低粗利パッキン・限界利益率15%）比率: {rA}%</span>
                  <span className="text-slate-500">B: {rB}% / C: {rC}%</span>
                </div>
                <input type="range" min="5" max="80" value={rA} onChange={e => handleSlider(parseInt(e.target.value))} className="w-full accent-rose-500 cursor-pointer h-2" />
              </div>

              <div className="grid md:grid-cols-3 gap-3">
                <button onClick={() => { setRA(70); setRB(25); setRC(5); }} className="p-3 rounded-xl border text-left hover:bg-slate-50">
                  <span className="text-xs font-bold text-rose-600 block">① 従来型（量産依存）</span>
                  <span className="text-xs text-slate-500">A:70% / 利益: ▲35万円</span>
                </button>
                <button onClick={() => { setRA(30); setRB(50); setRC(20); }} className="p-3 rounded-xl border text-left hover:bg-slate-50">
                  <span className="text-xs font-bold text-blue-600 block">② 改善途上（バランス型）</span>
                  <span className="text-xs text-slate-500">A:30% / 利益: ＋145万円</span>
                </button>
                <button onClick={() => { setRA(10); setRB(30); setRC(60); }} className="p-3 rounded-xl border text-left hover:bg-slate-50">
                  <span className="text-xs font-bold text-emerald-600 block">③ 高収益シフト型（理想）</span>
                  <span className="text-xs text-slate-500">A:10% / 利益: ＋315万円！</span>
                </button>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-xs md:text-sm space-y-2">
              <h4 className="font-bold border-b pb-2 text-slate-700">損益計算書 (PL)</h4>
              <div className="flex justify-between"><span>売上高</span><span className="font-bold">1,000 万円</span></div>
              <div className="flex justify-between text-rose-600"><span>変動費</span><span>- {1000 - totalM} 万円</span></div>
              <div className="flex justify-between font-bold bg-blue-50 p-2 rounded text-blue-900"><span>全社限界利益</span><span>{totalM} 万円</span></div>
              <div className="flex justify-between text-slate-500"><span>固定費</span><span>- 300 万円</span></div>
              <div className="flex justify-between font-black text-base border-t pt-2"><span>営業利益</span><span className={op >= 0 ? 'text-emerald-600' : 'text-rose-600'}>{op >= 0 ? `+${op}` : op} 万円</span></div>
            </div>
          </main>
        </div>
      );
    }

    // =========================================================================
    // モジュール5：技術提案型営業アドベンチャー
    // =========================================================================
    function SalesView({ onBack }) {
      const [stg, setStg] = useState(0);
      const [prob, setProb] = useState(25);
      const [rate, setRate] = useState(40);
      const [sel, setSel] = useState(null);
      const [showFb, setShowFb] = useState(false);
      const [done, setDone] = useState(false);

      const cur = SALES_DATA[stg];

      const handleSelect = (i) => {
        setSel(i);
        const o = cur.opts[i];
        setProb(p => Math.max(0, Math.min(100, p + o.prob)));
        setRate(r => Math.max(10, Math.min(85, r + o.rate)));
        setShowFb(true);
      };

      const handleNext = () => {
        if (stg < SALES_DATA.length - 1) {
          setStg(s => s + 1);
          setSel(null);
          setShowFb(false);
        } else {
          setDone(true);
        }
      };

      return (
        <div>
          <SubHeader title="技術提案型営業アドベンチャー" sub="打ち手②：AIDMA営業プロセス" icon={Compass} onBack={onBack} />
          <main className="max-w-2xl mx-auto px-4 py-6">
            {!done ? (
              <div className="bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-6">
                <div className="flex justify-between items-center text-xs font-bold border-b pb-3">
                  <span className="bg-purple-600 text-white px-2.5 py-1 rounded-md">{cur.step}</span>
                  <div className="flex gap-4">
                    <span>受注確度: <strong className="text-purple-600">{prob}%</strong></span>
                    <span>想定粗利率: <strong className="text-emerald-600">{rate}%</strong></span>
                  </div>
                </div>

                <p className="text-xs md:text-sm text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-200 leading-relaxed font-medium">
                  {cur.sit}
                </p>

                <div className="space-y-3">
                  {cur.opts.map((opt, i) => (
                    <button
                      key={i}
                      disabled={showFb}
                      onClick={() => handleSelect(i)}
                      className={`w-full text-left p-4 rounded-xl border-2 text-xs md:text-sm font-bold transition-all ${
                        sel === i ? 'border-purple-600 bg-purple-50 text-purple-900' : 'border-slate-200 hover:border-slate-300 bg-white'
                      }`}
                    >
                      {opt.text}
                    </button>
                  ))}
                </div>

                {showFb && (
                  <div className={`p-5 rounded-2xl border-2 space-y-3 text-xs md:text-sm animate-in fade-in ${
                    cur.opts[sel].best ? 'bg-emerald-50 border-emerald-300 text-emerald-950' : 'bg-rose-50 border-rose-300 text-rose-950'
                  }`}>
                    <p className="leading-relaxed font-medium">{cur.opts[sel].fb}</p>
                    <button onClick={handleNext} className="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-xs hover:bg-slate-800">
                      {stg < SALES_DATA.length - 1 ? '次の商談フェーズへ進む →' : '最終結果を見る'}
                    </button>
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-white rounded-3xl p-8 border border-slate-200 text-center space-y-6">
                <Trophy className="w-16 h-16 text-purple-600 mx-auto" />
                <h3 className="text-2xl font-black text-slate-900">
                  {prob >= 60 && rate >= 60 ? '🏆 満額成約！開発パートナーモデル達成！' : '⚠️ 下請け価格競争の罠に低迷'}
                </h3>
                <p className="text-xs text-slate-500">
                  {prob >= 60 && rate >= 60 ? '図面が出る前のレシピ提案と納期バリュープライシングにより、値引きゼロで限界利益率70%超を勝ち取りました！' : '図面待ちや安易な値引きにより、売上は取れても手元にお金が残らない結果となりました。'}
                </p>
                <button onClick={() => { setStg(0); setProb(25); setRate(40); setSel(null); setShowFb(false); setDone(false); }} className="px-8 py-3 bg-slate-900 text-white font-bold rounded-xl text-xs">
                  もう一度挑戦する
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    // =========================================================================
    // モジュール6：ECRS原則マスター
    // =========================================================================
    function EcrsView({ onBack }) {
      const [idx, setIdx] = useState(0);
      const [sel, setSel] = useState(null);
      const [showFb, setShowFb] = useState(false);
      const [score, setScore] = useState(0);
      const [done, setDone] = useState(false);

      const q = ECRS_DATA[idx];

      const handleAns = (k) => {
        if (sel) return;
        const isCor = k === q.ans;
        setSel(k);
        setShowFb(true);
        if (isCor) setScore(s => s + 1);
      };

      const handleNext = () => {
        if (idx < ECRS_DATA.length - 1) {
          setIdx(i => i + 1);
          setSel(null);
          setShowFb(false);
        } else {
          setDone(true);
        }
      };

      return (
        <div>
          <SubHeader title="ECRS（イクルス）原則マスター" sub="打ち手③：ムダ取り4原則" icon={Scissors} onBack={onBack} />
          <main className="max-w-2xl mx-auto px-4 py-6">
            {!done ? (
              <div className="bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-6">
                <div className="flex justify-between items-center text-xs font-bold border-b pb-3">
                  <span className="bg-amber-600 text-white px-2.5 py-1 rounded-md">{q.title}</span>
                  <span>正解数: {score} 問</span>
                </div>

                <p className="text-xs md:text-sm text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-200 leading-relaxed font-medium">
                  {q.sit}
                </p>

                {q.ans !== 'PRIORITY' ? (
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                    {[
                      { k: 'E', l: 'E：排除' },
                      { k: 'C', l: 'C：結合' },
                      { k: 'R', l: 'R：入替' },
                      { k: 'S', l: 'S：簡素化' }
                    ].map(item => (
                      <button
                        key={item.k}
                        disabled={showFb}
                        onClick={() => handleAns(item.k)}
                        className="p-4 rounded-xl border-2 font-bold text-sm hover:bg-slate-50 text-center"
                      >
                        {item.l}
                      </button>
                    ))}
                  </div>
                ) : (
                  <div className="space-y-2">
                    {[
                      { k: 'PRIORITY', l: 'E（排除）→ C（結合）→ R（入替）→ S（簡素化）' },
                      { k: 'W1', l: 'S（簡素化）→ R（入替）→ C（結合）→ E（排除）' },
                      { k: 'W2', l: '思いついた簡単なものから順にやる' }
                    ].map(opt => (
                      <button
                        key={opt.k}
                        disabled={showFb}
                        onClick={() => handleAns(opt.k)}
                        className="w-full p-4 rounded-xl border-2 text-left text-xs md:text-sm font-bold hover:bg-slate-50"
                      >
                        {opt.l}
                      </button>
                    ))}
                  </div>
                )}

                {showFb && (
                  <div className="p-5 rounded-2xl bg-amber-50 border-2 border-amber-300 text-amber-950 text-xs md:text-sm space-y-3 animate-in fade-in">
                    <h4 className="font-black">正解は「{q.name}」です！</h4>
                    <p className="leading-relaxed">
                      {q.ans === 'PRIORITY'
                        ? '道具を買う（S）前に、まず工程そのものをなくせないか（E）を徹底的に考えるのが改善の鉄則です！'
                        : 'ECRS（イクルス）の視点を持つことで、現場の無駄な作業を費用ゼロで消し去ることができます。'}
                    </p>
                    <button onClick={handleNext} className="w-full py-3 bg-slate-900 text-white font-bold rounded-xl text-xs hover:bg-slate-800">
                      {idx < ECRS_DATA.length - 1 ? '次の問題へ進む →' : '結果を見る'}
                    </button>
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-white rounded-3xl p-8 border border-slate-200 text-center space-y-6">
                <Trophy className="w-16 h-16 text-amber-500 mx-auto" />
                <h3 className="text-2xl font-black text-slate-900">クイズ完了！</h3>
                <div className="text-4xl font-black text-amber-600">{score} / 5 問正解</div>
                <button onClick={() => { setIdx(0); setSel(null); setShowFb(false); setScore(0); setDone(false); }} className="px-8 py-3 bg-slate-900 text-white font-bold rounded-xl text-xs">
                  もう一度挑戦する
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    // =========================================================================
    // モジュール7：廃棄ゼロ化・返品コストシミュレーター
    // =========================================================================
    function DefectView({ onBack }) {
      const [step, setStep] = useState(0);

      const cur = DEFECT_STEPS.slice(0, step);
      const extra = cur.reduce((s, x) => s + x.cost, 0);
      const hours = cur.reduce((s, x) => s + x.hours, 0);
      const profit = 15 - extra; // 正常時利益15万

      return (
        <div>
          <SubHeader title="廃棄ゼロ化・返品コストシミュレーター" sub="打ち手③：返品ドミノ" icon={Flame} onBack={onBack} />
          <main className="max-w-2xl mx-auto px-4 py-6 space-y-6">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
              <div>
                <h3 className="font-bold text-slate-900 text-sm">産業機器向け特注パッキン（売上50万円 / 予定利益 ＋15万円）</h3>
                <span className="text-xs text-rose-600 font-bold">⚠️ 配合表の読み間違いにより全数返品発生！</span>
              </div>
              <div className="flex gap-4 text-xs font-bold shrink-0">
                <div>追加損失: <strong className="text-rose-600 text-base block">▲{extra}万</strong></div>
                <div>浪費時間: <strong className="text-amber-600 text-base block">{hours}時間</strong></div>
                <div>最終損益: <strong className={`text-base block ${profit >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>{profit >= 0 ? `+${profit}` : profit}万</strong></div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <h4 className="font-bold text-slate-900 text-sm">不良品発生が引き起こす「悪夢の5連鎖」</h4>
              <div className="space-y-3">
                {DEFECT_STEPS.map((d, i) => {
                  const triggered = i < step;
                  return (
                    <div key={d.step} className={`p-4 rounded-xl border-2 transition-all ${triggered ? 'bg-rose-50 border-rose-300' : 'bg-slate-50 border-slate-200 opacity-50'}`}>
                      <div className="flex justify-between font-bold text-xs md:text-sm">
                        <span className="text-slate-900">{d.step}. {d.title}</span>
                        <span className="text-rose-600">▲{d.cost}万円 / {d.hours}時間</span>
                      </div>
                      {triggered && <p className="text-xs text-slate-600 mt-2">{d.desc}</p>}
                    </div>
                  );
                })}
              </div>

              <div className="pt-2 flex justify-between items-center">
                {step > 0 && (
                  <button onClick={() => setStep(0)} className="text-xs font-bold text-slate-500 hover:text-slate-800">
                    最初からやり直す
                  </button>
                )}
                <div className="ml-auto">
                  {step < DEFECT_STEPS.length ? (
                    <button onClick={() => setStep(s => s + 1)} className="px-6 py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl shadow">
                      次の被害を進める（ドミノを倒す） →
                    </button>
                  ) : (
                    <span className="text-xs font-bold text-rose-600 bg-rose-100 px-3 py-1.5 rounded-lg">すべての連鎖が完了しました</span>
                  )}
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // レンダリング実行
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
